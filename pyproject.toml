[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hohmannpy"
version = "0.2.0"
description = "An open-source library designed for rapid spacecraft design and iteration."
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [{name = "Nicholas Hirsch"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "imageio",
    "pylinalg",
    "rendercanvas",
    "pygfx",
    "pyside6",
    "dracopy",
    "gltflib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hohmannpy*"]

[tool.setuptools.package-data]
"hohmannpy.resources" = [
    "*.csv",
    "gfx/*.png",
    "gfx/skybox/*.png",
    "gfx/models/*.glb"
]